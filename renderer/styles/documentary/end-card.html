<!doctype html>
<html><head><meta charset="utf-8">
<style>
html,body{margin:0;width:var(--W);height:var(--H);overflow:hidden;background:#000;color:var(--fg);font-family:var(--body);font-weight:var(--wb)}
#glow{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 50%, color-mix(in srgb, var(--accent) 14%, var(--bg)) 0, var(--bg) 45%, #000 100%)}
.bar{position:absolute;left:0;right:0;height:calc(var(--H) * .1);background:#000}
#bt{top:0}#bb{bottom:0}
.safe{position:absolute;left:var(--sx);top:var(--sy);width:var(--sw);height:var(--sh);display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:1%;box-sizing:border-box}
.safe>*{flex:none;margin:0;max-width:100%}
#title{width:100%;font-family:var(--display);font-weight:var(--wd);line-height:1.15}
#rule{width:calc(var(--u)*10);height:max(1px, calc(var(--u)*.18));background:var(--accent);margin:calc(var(--u)*3.5) 0}
#cta{width:100%;font-style:italic;color:var(--fg);line-height:1.35}
#handle{width:100%;margin-top:calc(var(--u)*2.5);color:var(--accent);letter-spacing:.15em;line-height:1.3}
</style></head>
<body>
<div id="glow"></div>
<div class="safe" id="safe"><h1 id="title"></h1><div id="rule"></div><p id="cta"></p><p id="handle"></p></div>
<div class="bar" id="bt"></div><div class="bar" id="bb"></div>
<script src="../_shared/runtime.js"></script>
<script>
const $ = (id) => document.getElementById(id);
VF.boot((S) => {
  const p = S.props, u = S.u, W = S.box.w * 0.98, H = S.box.h - S.box.w * 0.02;
  $("title").textContent = VF.opt(p.title, "Thank you for watching");
  $("cta").textContent = VF.opt(p.cta, "");
  $("handle").textContent = VF.opt(p.handle, "");
  let used = 0;
  if ($("handle").textContent) { VF.fitText($("handle"), W, H * 0.08, 2.4 * u, 1.3 * u); used += $("handle").offsetHeight + 2.5 * u; }
  else $("handle").style.display = "none";
  if ($("cta").textContent) { VF.fitText($("cta"), W, H * 0.2, 3.6 * u, 1.6 * u); used += $("cta").offsetHeight; }
  else $("cta").style.display = "none";
  if ($("cta").textContent || $("handle").textContent) used += 7.2 * u; else $("rule").style.display = "none";
  VF.fitText($("title"), W, H - used, 9 * u, 2.6 * u);
}, (t, S) => {
  const st = S.stagger, g = VF.enter(t, S, 0);
  VF.show($("glow"), g);
  VF.show($("title"), VF.enter(t, S, st));
  const r = VF.enter(t, S, 2 * st);
  $("rule").style.transform = r === 1 ? "" : `scaleX(${r})`;
  VF.show($("cta"), VF.enter(t, S, 2.5 * st));
  VF.show($("handle"), VF.enter(t, S, 3 * st));
  const x = VF.exit(t, S), safe = $("safe");
  safe.style.opacity = x > 0 ? 1 - x : "";
  safe.style.transform = `scale(${1 + 0.02 * (t / S.duration)})`;
});
</script>
</body></html>
