<!doctype html>
<html><head><meta charset="utf-8">
<style>
html,body{margin:0;width:var(--W);height:var(--H);overflow:hidden;background:var(--bg);color:var(--fg);font-family:var(--body);font-weight:var(--wb)}
#vig{position:absolute;inset:0;background:radial-gradient(ellipse at center, transparent 50%, rgba(0,0,0,.6) 100%)}
.bar{position:absolute;left:0;right:0;height:calc(var(--H) * .1);background:#000}
#bt{top:0}#bb{bottom:0}
.safe{position:absolute;left:var(--sx);top:var(--sy);width:var(--sw);height:var(--sh);display:flex;flex-direction:column;justify-content:center;padding:1%;box-sizing:border-box}
.safe>*{flex:none;margin:0;width:100%}
#heading{font-family:var(--display);font-weight:var(--wd);line-height:1.15;margin-bottom:calc(var(--u)*3.5)}
#items{list-style:none;padding:0;line-height:1.3}
#items li{display:flex;align-items:baseline;gap:.8em;padding:.45em 0;border-top:1px solid color-mix(in srgb, var(--muted) 45%, transparent)}
#items li:last-child{border-bottom:1px solid color-mix(in srgb, var(--muted) 45%, transparent)}
.num{flex:none;min-width:2.2em;color:var(--accent);font-variant:small-caps;letter-spacing:.08em}
.txt{flex:1;min-width:0}
</style></head>
<body>
<div id="vig"></div>
<div class="safe" id="safe"><h2 id="heading"></h2><ul id="items"></ul></div>
<div class="bar" id="bt"></div><div class="bar" id="bb"></div>
<script src="../_shared/runtime.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const ROMAN = ["I", "II", "III", "IV", "V", "VI"];
let rows = [];
VF.boot((S) => {
  const p = S.props, u = S.u, W = S.box.w * 0.98, H = S.box.h - S.box.w * 0.02;
  let items = VF.list(p.items).slice(0, 6);
  if (!items.length) items = ["[missing items]"];
  items.forEach((txt, i) => {
    const li = document.createElement("li");
    li.innerHTML = '<span class="num"></span><span class="txt"></span>';
    li.firstChild.textContent = ROMAN[i] + ".";
    li.lastChild.textContent = txt;
    $("items").appendChild(li);
  });
  rows = Array.from($("items").children);
  $("heading").textContent = VF.opt(p.heading, "");
  let used = 0;
  if ($("heading").textContent) {
    VF.fitText($("heading"), W, H * 0.22, 6.5 * u, 2.2 * u);
    used = $("heading").offsetHeight + 3.5 * u;
  } else $("heading").style.display = "none";
  VF.fitText($("items"), W, H - used, 4.6 * u, 1.6 * u);
}, (t, S) => {
  const n = rows.length;
  const step = Math.max(S.stagger, (0.6 * Math.max(0, S.duration - S.inD - S.outD)) / n);
  VF.show($("heading"), VF.enter(t, S, 0));
  rows.forEach((r, i) => VF.show(r, VF.enter(t, S, S.inD * 0.6 + i * step)));
  const x = VF.exit(t, S), safe = $("safe");
  safe.style.opacity = x > 0 ? 1 - x : "";
  safe.style.transform = `scale(${1 + 0.02 * (t / S.duration)})`;
});
</script>
</body></html>
