<!doctype html>
<html><head><meta charset="utf-8"></head><body>
<script src="kit.js"></script>
<script src="stage.js"></script>
<script>
// hero — the hoodie hero on a simple set, acting one beat, with up to 3 label pills popping in on the right.
const { C, E, W, H, alpha, armIK, ellipse, figure, glow, layer, lerp, linGrad, rect, ramp, stars, voidBg, walk, kitchen } = SK;
const MOODS = {
  neutral: { eyes: "dot", mouth: "flat" }, happy: { eyes: "happy", mouth: "grin" }, smug: { eyes: "smug", mouth: "smirk" },
  shocked: { eyes: "wide", mouth: "o", brows: true }, worried: { eyes: "wide", mouth: "flat", brows: "worried" },
  talking: { eyes: "dot", mouth: "chatter" }, sleepy: { eyes: "closed", mouth: "flat" },
};
const OUTFITS = {
  blue: undefined, red: { hoodie: "#d23b45", dark: "#a52733", shade: "#86202b", strings: "#f7e6e6" },
  green: { hoodie: "#2f9c6a", dark: "#257c55", shade: "#1d6445", strings: "#e6f7ee" },
  yellow: { hoodie: "#e8b030", dark: "#c18f20", shade: "#9e7418", strings: "#fff4d6" },
  purple: { hoodie: "#7a4fd0", dark: "#623db0", shade: "#4f3190", strings: "#efe6ff" },
};
const WARM = { color: "#ffd9a6", width: 3.5, dx: 4, dy: -4 }, COOL = { color: "#e8eef8", width: 3, dx: -3, dy: -3 };
const set = (x, kind, t) => {
  if (kind === "kitchen") return kitchen(x);
  if (kind === "dawn") {
    x.fillStyle = linGrad(x, 0, 0, 0, 1080, [[0, "#7fb2e0"], [0.62, "#f6d3ac"], [1, "#e6a77a"]]);
    x.fillRect(0, 0, W, H);
    glow(x, 1500, 760, 700, "#fff1d6", 0.5);
    rect(x, 0, 900, W, 180, "#c98f6a");
    return;
  }
  voidBg(x, kind === "night" ? "#1a2140" : "#1d2740", 760, 560);
  if (kind === "night") stars(x, t);
};
stickman((x, t, f, S) => {
  const p = S.props;
  const pills = SM.list(p.pills).slice(0, 3);
  const kind = ["void", "night", "dawn", "kitchen"].includes(p.set) ? p.set : "void";
  const face = { ...(MOODS[p.mood] || MOODS.neutral) };
  if (face.mouth === "chatter") face.mouth = Math.floor(t * 9) % 3 === 0 ? "flat" : "o";
  const action = p.action || "stand";
  const hx = pills.length ? 620 : 960;
  const k = ramp(t, 0.1, 0.6, E.out);
  let pose = {}, dx = 0;
  if (action === "wave") pose = { armR: armIK(150, -200 + 30 * Math.sin(t * 9) * k, -1) };
  else if (action === "shrug") pose = { armL: armIK(lerp(-60, -150, k), lerp(150, -10, k), 1), armR: armIK(lerp(60, 150, k), lerp(150, -10, k), -1) };
  else if (action === "point") pose = { armR: armIK(lerp(60, 230, k), lerp(150, -120, k), -1) };
  else if (action === "think") pose = { armR: armIK(28, -150, 1), tilt: 6 };
  else if (action === "walk") { pose = walk(t * 7); dx = (t / S.duration - 0.5) * 260; }
  const push = 1 + 0.025 * ramp(t, 0, S.duration, E.linear);
  layer(x, { blur: kind === "kitchen" ? 8 : 0, cam: { cx: 960, cy: 540, s: push } }, (x) => set(x, kind, t));
  layer(x, { cam: { cx: 960, cy: 560, s: push } }, (x) => {
    if (kind === "void") glow(x, hx, 700, 520, "#e8a868", 0.18);
    alpha(x, 0.35, () => ellipse(x, hx + dx, 962, 150, 22, "#000"));
    figure(x, { x: hx + dx, y: 960, s: 1.15, tone: "hero", pose, outfit: OUTFITS[p.hoodie], rim: kind === "dawn" || kind === "kitchen" ? WARM : COOL, face: { look: pills.length ? 0.35 : 0, blink: Math.floor(t * 10) % 37 === 0 ? 1 : 0, ...face } });
  });
  // label pills: evenly spaced over 15–65 % of the scene, stacked on the right
  pills.forEach((s, i) => {
    const at0 = S.duration * (0.15 + (pills.length > 1 ? (0.5 * i) / (pills.length - 1) : 0));
    const kk = ramp(t, at0, at0 + 0.28, E.linear);
    const size = SM.fit(x, s, 760, 44, 22, 800, 0.06);
    SK.pill(x, s, 1380, 360 + i * 150, kk, { size, accent: SM.accent(p.accent, i) });
  });
});
</script>
</body></html>
