<!doctype html>
<html><head><meta charset="utf-8">
<style>
html,body{margin:0;width:var(--W);height:var(--H);overflow:hidden;background:var(--accent);color:var(--bg);font-family:var(--body);font-weight:var(--wb)}
#wipe{position:absolute;inset:0;background:var(--bg);transform-origin:right center}
.ring{position:absolute;border-radius:50%;border:calc(var(--u)*1.2) solid var(--bg);opacity:.18}
#r1{width:calc(var(--u)*60);height:calc(var(--u)*60);right:calc(var(--u)*-20);bottom:calc(var(--u)*-20)}
#r2{width:calc(var(--u)*30);height:calc(var(--u)*30);left:calc(var(--u)*-8);top:calc(var(--u)*-8)}
.safe{position:absolute;left:var(--sx);top:var(--sy);width:var(--sw);height:var(--sh);display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}
.safe>*{flex:none;margin:0;max-width:100%}
#title{width:100%;font-family:var(--display);font-weight:var(--wd);line-height:1.08;letter-spacing:-.02em}
#cta{margin-top:calc(var(--u)*4);background:var(--bg);color:var(--accent);font-weight:var(--wd);padding:.55em 1.3em;border-radius:99px;line-height:1.2;box-sizing:border-box}
#handle{margin-top:calc(var(--u)*2.5);line-height:1.2;opacity:.85}
</style></head>
<body>
<div class="ring" id="r1"></div><div class="ring" id="r2"></div><div id="wipe"></div>
<div class="safe" id="safe"><h1 id="title"></h1><p id="cta"></p><p id="handle"></p></div>
<script src="../_shared/runtime.js"></script>
<script>
const $ = (id) => document.getElementById(id);
VF.boot((S) => {
  const p = S.props, u = S.u, W = S.box.w, H = S.box.h;
  $("title").textContent = VF.opt(p.title, "Thanks for watching!");
  $("cta").textContent = VF.opt(p.cta, "Subscribe for more");
  $("handle").textContent = VF.opt(p.handle, "");
  let used = 0;
  if ($("handle").textContent) { VF.fitText($("handle"), W, H * 0.1, 3.4 * u, 1.6 * u); used += $("handle").offsetHeight + 2.5 * u; }
  else $("handle").style.display = "none";
  VF.fitText($("cta"), W, H * 0.2, 4 * u, 1.6 * u);
  used += $("cta").offsetHeight + 4 * u;
  VF.fitText($("title"), W, H - used, 13 * u, 3 * u);
}, (t, S) => {
  const u = S.u, st = S.stagger, w = VF.enter(t, S, 0);
  $("wipe").style.transform = w === 1 ? "scaleX(0)" : `scaleX(${1 - w})`;
  [["title", 0], ["cta", st], ["handle", 2 * st]].forEach(([id, d]) => {
    const a = VF.enter(t, S, S.inD * 0.6 + d);
    VF.show($(id), a, `translateY(${(1 - a) * 3 * u}px)`);
  });
  $("r1").style.transform = `rotate(${t * 6}deg) scale(${1 + t * 0.02})`;
  VF.show($("safe"), 1 - VF.exit(t, S));
});
</script>
</body></html>
