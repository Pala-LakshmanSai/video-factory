# Publishes docs from main to the control plane so every claude.ai Project gets them live through
# the connector's project_brief / style_guide tools (docs/SYNC.md). Auth: the VF_DOCS_TOKEN repo secret, equal to the
# Worker secret DOCS_PUBLISH_TOKEN; it can only publish docs (the repo is public, so read access proves nothing).
name: docs-sync
on:
  push:
    branches: [main]
    paths: ["docs/**", "scripts/vf.mjs", "scripts/install.sh", "scripts/install.ps1", ".github/workflows/docs-sync.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22.20.0" }
      - run: node scripts/vf.mjs docs publish
        env:
          VF_GITHUB_TOKEN: ${{ secrets.VF_DOCS_TOKEN }}
