name: control-plane
on:
  push:
    paths: ["control-plane/**", "packages/**", ".github/workflows/control-plane.yml"]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-24.04
    defaults: { run: { working-directory: control-plane } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22.20.0" }
      - run: npm ci --legacy-peer-deps --no-audit --no-fund
      - run: npx tsc --noEmit
      - run: npx vitest run
