# Build and push the renderer image with a pinned tag (SPEC §6: imageName ...:<pinned-tag>).
name: renderer
on:
  push:
    branches: [main]
    paths: ["renderer/**", "packages/**", "bench/**", ".github/workflows/renderer.yml"]
  workflow_dispatch:
    inputs:
      golden_write:
        description: "Write golden reference JPEGs (uploaded as the golden-refs artifact)"
        type: boolean
        default: false

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22.20.0" }
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-inter fonts-noto-core fonts-noto-cjk fonts-noto-color-emoji
      - working-directory: renderer
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
          npx tsc --noEmit
          TEST_OUT=test/out node --test test/*.test.ts
        env:
          GOLDEN_WRITE: ${{ inputs.golden_write && '1' || '' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: golden-diffs, path: renderer/test/out, if-no-files-found: ignore }
      - uses: actions/upload-artifact@v4
        if: inputs.golden_write
        with: { name: golden-refs, path: renderer/test/golden }

  image:
    needs: test
    runs-on: ubuntu-24.04
    # Private GHCR instead of Docker Hub (CONTRACT Extension 11): pushed with the job's own GITHUB_TOKEN.
    permissions:
      contents: read
      packages: write
    env:
      IMG: ghcr.io/pala-lakshmansai/video-renderer
    steps:
      - name: Free runner disk (CUDA base + Chromium image is several GB)
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - id: tag
        run: echo "ref=${IMG}:${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: renderer/Dockerfile
          platforms: linux/amd64
          load: true
          tags: ${{ steps.tag.outputs.ref }}
          cache-from: type=gha
          cache-to: type=gha,mode=max,ignore-error=true
      - name: Smoke test the image
        env: { REF: "${{ steps.tag.outputs.ref }}" }
        run: |
          echo "image size: $(( $(docker image inspect -f '{{.Size}}' "$REF") / 1000000 )) MB" | tee -a "$GITHUB_STEP_SUMMARY"
          test "$(docker run --rm --entrypoint id "$REF" -u)" != 0
          docker run --rm --entrypoint ffmpeg "$REF" -hide_banner -encoders | grep -E 'h264_nvenc|libx264'
          docker run --rm "$REF" --selftest | tee selftest.log
          grep -q 'encoder: libx264' selftest.log
          docker run --rm --network none --entrypoint node "$REF" --input-type=module -e "const m = await import('/app/renderer/engine/voice.ts'); await m.tts('Offline check.', '/tmp/t.wav'); console.log('offline TTS ok')"
      # Push exactly the image that passed the smoke test (no rebuild), only from main.
      - if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env: { REF: "${{ steps.tag.outputs.ref }}" }
        run: |
          docker push "$REF"
          digest=$(docker inspect -f '{{index .RepoDigests 0}}' "$REF")
          {
            echo "### Renderer image (private GHCR)"
            echo "Pinned tag: \`$REF\`"
            echo "Digest: \`$digest\`"
            echo "Set \`RENDERER_IMAGE\` in control-plane/wrangler.jsonc to the pinned tag; RunPod pulls it with the ghcr.io registry auth."
          } >> "$GITHUB_STEP_SUMMARY"
