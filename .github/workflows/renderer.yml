# Build and push the renderer image with a pinned tag (SPEC §6: imageName ...:<pinned-tag>).
name: renderer
on:
  push:
    branches: [main]
    paths: ["renderer/**", "packages/**", "bench/**", ".github/workflows/renderer.yml"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22.20.0" }
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-inter fonts-noto-core fonts-noto-cjk fonts-noto-color-emoji
      - working-directory: renderer
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
          npx tsc --noEmit
          node --test test/*.test.ts
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: golden-diffs, path: renderer/test/out, if-no-files-found: ignore }

  image:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: tag
        run: echo "image=docker.io/${{ secrets.DOCKERHUB_USERNAME }}/video-renderer:${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: renderer/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tag.outputs.image }}
          cache-from: type=registry,ref=docker.io/${{ secrets.DOCKERHUB_USERNAME }}/video-renderer:buildcache
          cache-to: type=registry,ref=docker.io/${{ secrets.DOCKERHUB_USERNAME }}/video-renderer:buildcache,mode=max
      - run: |
          echo "### Renderer image" >> "$GITHUB_STEP_SUMMARY"
          echo "Set \`RENDERER_IMAGE\` in control-plane/wrangler.jsonc to:" >> "$GITHUB_STEP_SUMMARY"
          echo "\`${{ steps.tag.outputs.image }}\`" >> "$GITHUB_STEP_SUMMARY"
