# Build and push the renderer image with a pinned tag (SPEC §6: imageName ...:<pinned-tag>).
name: renderer
on:
  push:
    branches: [main]
    paths: ["renderer/**", "packages/**", "bench/**", ".github/workflows/renderer.yml"]
  workflow_dispatch:
    inputs:
      golden_write:
        description: "Write golden reference JPEGs (uploaded as the golden-refs artifact)"
        type: boolean
        default: false

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22.20.0" }
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-inter fonts-noto-core fonts-noto-cjk fonts-noto-color-emoji
      - working-directory: renderer
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
          npx tsc --noEmit
          TEST_OUT=test/out node --test test/*.test.ts
        env:
          GOLDEN_WRITE: ${{ inputs.golden_write && '1' || '' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: golden-diffs, path: renderer/test/out, if-no-files-found: ignore }
      - uses: actions/upload-artifact@v4
        if: inputs.golden_write
        with: { name: golden-refs, path: renderer/test/golden }

  image:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - name: Free runner disk (CUDA base + Chromium image is several GB)
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - id: hub
        env: { HUB_USER: "${{ secrets.DOCKERHUB_USERNAME }}" }
        run: |
          if [ -n "$HUB_USER" ]; then echo "push=true" >> "$GITHUB_OUTPUT"; else echo "push=false" >> "$GITHUB_OUTPUT"; echo "::notice::Docker Hub secrets not set: building and smoke-testing only, no push"; fi
          echo "image=docker.io/${HUB_USER:-local}/video-renderer:${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: renderer/Dockerfile
          platforms: linux/amd64
          load: true
          tags: ${{ steps.hub.outputs.image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max,ignore-error=true
      - name: Smoke test the image
        env: { IMG: "${{ steps.hub.outputs.image }}" }
        shell: bash # -eo pipefail: a failing docker run piped into tee fails the step
        run: |
          echo "image size: $(( $(docker image inspect -f '{{.Size}}' "$IMG") / 1000000 )) MB" | tee -a "$GITHUB_STEP_SUMMARY"
          uid=$(docker run --rm --entrypoint id "$IMG" -u)
          test -n "$uid" && test "$uid" != 0
          docker run --rm --entrypoint ffmpeg "$IMG" -hide_banner -encoders > encoders.txt
          grep -q ' h264_nvenc ' encoders.txt
          grep -q ' libx264 ' encoders.txt
          docker run --rm "$IMG" --selftest | tee selftest.log
          grep -q 'encoder: libx264' selftest.log
          grep -q 'encoded 150 frames of 1080p with libx264' selftest.log
          docker run --rm --network none --entrypoint node "$IMG" --input-type=module -e "const m = await import('/app/renderer/engine/voice.ts'); await m.tts('Offline check.', '/tmp/t.wav'); console.log('offline TTS ok')"
          # Offline preview render through the real engine (image's non-root user, no network).
          mkdir -m 777 smoke
          docker run --rm --network none -v "$PWD/smoke:/out" --entrypoint node "$IMG" --input-type=module -e "
            const { renderPreviews } = await import('/app/renderer/engine/render.ts');
            const { readFile, writeFile } = await import('node:fs/promises');
            const plan = JSON.parse(await readFile('/app/renderer/styles/explainer/example-plan.json', 'utf8'));
            const f = await renderPreviews({ plan, stylesDir: '/app/renderer/styles', workDir: '/tmp/p', audioPath: null, audioSeconds: plan.scenes.reduce((a, s) => a + s.duration_s, 0) });
            if (f.size !== plan.scenes.length * 3) throw new Error('got ' + f.size + ' previews');
            for (const [n, j] of f) {
              if (j.length < 10000 || j[0] !== 0xff || j[1] !== 0xd8) throw new Error(n + ': bad jpeg, ' + j.length + ' bytes');
              await writeFile('/out/' + n + '.jpg', j);
              console.log(n, j.length);
            }
            console.log('offline previews ok:', f.size);" | tee -a "$GITHUB_STEP_SUMMARY"
          # Offline production voice path: prepareVoice(text) spawns node voice.ts <txt> <wav>.
          docker run --rm --network none --entrypoint node "$IMG" --input-type=module -e "
            const { prepareVoice } = await import('/app/renderer/engine/voice.ts');
            const v = await prepareVoice({ text: 'This is the offline voice check. It should last more than one second.' }, '/tmp/v', () => { throw new Error('no drive'); });
            if (!(v.seconds > 1)) throw new Error('voice too short: ' + v.seconds);
            console.log('offline prepareVoice ok:', v.path, v.seconds.toFixed(2), 's');" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: smoke-previews, path: smoke, if-no-files-found: ignore }
      - if: steps.hub.outputs.push == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - if: steps.hub.outputs.push == 'true'
        id: push
        name: Push the tested image (no rebuild)
        env: { IMG: "${{ steps.hub.outputs.image }}" }
        shell: bash
        run: |
          local_id=$(docker image inspect -f '{{.Id}}' "$IMG")
          docker push "$IMG"
          digest=$(docker image inspect -f '{{index .RepoDigests 0}}' "$IMG" | cut -d@ -f2)
          m=$(docker buildx imagetools inspect --raw "${IMG%:*}@$digest")
          d=$(jq -r '[.manifests[]? | select(.platform.os == "linux" and .platform.architecture == "amd64")][0].digest // empty' <<<"$m")
          [ -n "$d" ] && m=$(docker buildx imagetools inspect --raw "${IMG%:*}@$d")
          pushed_cfg=$(jq -r '.config.digest' <<<"$m")
          echo "local image id $local_id; pushed $digest (amd64 manifest ${d:-same}) config $pushed_cfg" | tee -a "$GITHUB_STEP_SUMMARY"
          # The pinned digest must be exactly the image the smoke test ran (classic store: id = config digest;
          # containerd store: id = manifest/index digest).
          test "$pushed_cfg" = "$local_id" || test "$digest" = "$local_id" || test "${d:-x}" = "$local_id"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - if: steps.hub.outputs.push == 'true'
        run: |
          echo "### Renderer image" >> "$GITHUB_STEP_SUMMARY"
          echo "Set \`RENDERER_IMAGE\` in control-plane/wrangler.jsonc to:" >> "$GITHUB_STEP_SUMMARY"
          echo "\`${{ steps.hub.outputs.image }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "digest: \`${{ steps.push.outputs.digest }}\`" >> "$GITHUB_STEP_SUMMARY"
      - name: Compressed size (new vs pinned)
        if: steps.hub.outputs.push == 'true'
        env:
          REPO: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/video-renderer
          NEW: ${{ steps.push.outputs.digest }}
          PINNED: sha256:65af4b0b77ddd434b33c7253f84f60b5f78a8d1e43bd1b63ca88e42567b566af
        run: |
          # Sum compressed layer sizes of the linux/amd64 manifest (resolving an index if present).
          size() {
            m=$(docker buildx imagetools inspect --raw "$REPO@$1")
            d=$(jq -r '[.manifests[]? | select(.platform.os == "linux" and .platform.architecture == "amd64")][0].digest // empty' <<<"$m")
            [ -n "$d" ] && m=$(docker buildx imagetools inspect --raw "$REPO@$d")
            jq '[.layers[].size] | add' <<<"$m"
          }
          n=$(size "$NEW"); p=$(size "$PINNED")
          echo "compressed layers: new $NEW = $n bytes ($((n / 1000000)) MB); pinned $PINNED = $p bytes ($((p / 1000000)) MB)" | tee -a "$GITHUB_STEP_SUMMARY"
